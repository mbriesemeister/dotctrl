---
- name: dotctrl-main
  hosts: localhost
#  gather_facts: "{{ not (only_config | default(false) | bool) }}"
  vars:
    only_config: false
    only_install: false

  tasks:

    # - name: Determine roles to run
    #   ansible.builtin.set_fact:
    #     run_roles: >-
    #       {{ 
    #         (ansible_run_tags | difference(['all']) | length > 0) 
    #         | ternary(ansible_run_tags | difference(['all']), default_roles) 
    #         | difference(exclude_roles | default([]))
    #       }}
    #   tags: [always]

    - name: "sudo | Check if sudo.ws is available"
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: sudo_ws

    - name: "sudo | Configure Ansible become executable in .bashrc"
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        regexp: '^export ANSIBLE_BECOME_EXE='
        line: 'export ANSIBLE_BECOME_EXE=/usr/bin/sudo.ws'
        state: present
        create: true
      when:
        - sudo_ws.stat.exists
        - sudo_ws.stat.executable

    - name: "sudo | Reload bashrc"
      ansible.builtin.shell: source ~/.bashrc
      args:
        executable: /bin/bash




    - name: Determine roles to run
      ansible.builtin.set_fact:
        run_roles: >-
          {{
            (
              (ansible_run_tags | reject('equalto', 'all') | list)
              if (ansible_run_tags | reject('equalto', 'all') | list | length > 0)
              else default_roles
            )
            | reject('in', exclude_roles | default([]))
            | list
          }}
      tags: [always]



    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags: [always]
