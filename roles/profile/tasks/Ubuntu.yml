---

# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Dotfiles"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Copy .profile file into home directory"
      ansible.builtin.copy:
        src: profile
        dest: ~/.profile
        mode: "0644"

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Add XCURSOR variables to .profile"
      ansible.builtin.blockinfile:
        path: "~/.profile"
        create: yes  # Falls die Datei auf einem Minimalsystem noch gar nicht existiert
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK: XCURSOR SETTINGS"
        block: |
          export XCURSOR_THEME="Yaru"
          export XCURSOR_SIZE=24

  when: not (only_install | default(false))