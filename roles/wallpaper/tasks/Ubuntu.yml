- name: "{{ role_name }} | Installation and Setup"
  block:

    # - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Clone Wallpapers from GitHub Repository"
    #   ansible.builtin.git:
    #     repo: "git@github.com:DEIN_GITHUB_NAME/DEIN_WALLPAPER_REPO.git"
    #     dest: "{{ ansible_facts['user_dir'] }}/Pictures/Wallpapers"
    #     force: no
    #     version: main
    #   ignore_errors: true
    #   register: _wallpaper_git_clone

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Ensure wallpaper directory structure exists"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - "{{ ansible_facts['user_dir'] }}/Pictures"
        - "{{ ansible_facts['user_dir'] }}/Pictures/wallpapers"

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Download specific Unsplash image as default"
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ ansible_facts['user_dir'] }}/Pictures/wallpapers/{{ item.name }}.jpg"
        mode: "0644"
      loop:
        - { name: "wallpaper_dark-purple", url: "https://unsplash.com/photos/1A_dO4TFKgM/download?force=true" }
        - { name: "wallpaper_medusa", url: "https://unsplash.com/photos/52uOhN_P13c/download?force=true" }
      # when: _wallpaper_git_clone is failed

  when: not (only_config | default(false))


