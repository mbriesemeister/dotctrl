    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Check if setup vault is mounted"
      ansible.builtin.command:
        argv:
          - mountpoint
          - -q
          - "{{ setup_vault_path }}"
      register: setup_vault_mount
      changed_when: false
      failed_when: false


    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install Fonts from SETUP-VAULT USB"
      block:
      
        # - name: Check local fonts directory
        #   ansible.builtin.stat:
        #     path: "{{ vault_assets_path }}/fonts"
        #   register: local_fonts

        - name: "fonts | Ensure user fonts directory exists"
          ansible.builtin.file:
            path: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
            state: directory
            mode: "0755"

        - name: Install local fonts
          ansible.builtin.copy:
            src: "{{ vault_assets_path }}/fonts/"
            dest: "{{ ansible_user_dir }}/.local/share/fonts/"
            mode: preserve
          # when: local_fonts.stat.exists

      when: setup_vault_mount.rc == 0


