---

# ---------------------------------------------------------
# BLOCK 1: INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "desktop-experience | audio | Check if pulseaudio user service exists"
      ansible.builtin.systemd_service:
        name: pulseaudio.service
        scope: user
      register: _pulseaudio_check
      failed_when: false

    - name: "desktop-experience | audio | Disable and mask conflicting PulseAudio services"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
        scope: user
      loop:
        - pulseaudio.service
        - pulseaudio.socket
      when: _pulseaudio_check.status is defined
      failed_when: false


    - name: "desktop-experience | audio | Install Pipewire & Co"
      ansible.builtin.apt:
        name:
          - pipewire
          - wireplumber
          - pavucontrol
          - pipewire-pulse
        state: present
      become: true

    - name: "desktop-experience | audio | Enable Pipewire user services"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        scope: user # Ganz wichtig: Startet im User-Kontext, nicht als root!
      loop:
        - pipewire.service
        - pipewire-pulse.service
        - wireplumber.service

  when: not (only_config | default(false))