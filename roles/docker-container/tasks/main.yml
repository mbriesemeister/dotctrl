---

# ---------------------------------------------------------
# BLOCK 1: INSTALLATION
# ---------------------------------------------------------
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Installation and Setup"
  block:

    - name: Pull docker image
      ansible.builtin.include_tasks:
        file: pull-image.yml

    - name: Create workspace
      ansible.builtin.include_tasks:
        file: create_workspace.yml

    - name: Create container
      ansible.builtin.include_tasks:
        file: create_container.yml

  when: not (only_config | default(false))