---

# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Check if starship is already installed"
      ansible.builtin.stat:
        path: /usr/local/bin/starship
      register: starship_binary

    - name: "{{ role_name }}| {{ ansible_facts['distribution'] }} | Install starship"
      ansible.builtin.shell: |
        curl -sS https://starship.rs/install.sh | sh -s -- -y
      args:
        creates: /usr/local/bin/starship
      become: true
      when: not starship_binary.stat.exists

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Ensure config directory structure exists"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - ~/.config

  when: not (only_config | default(false))


# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Dotfiles"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Copy btop config"
      ansible.builtin.copy:
        src: starship.toml
        dest: ~/.config/starship.toml
        mode: "0644"

  when: not (only_install | default(false))