
- name: Starship | {{ ansible_distribution }} | Check if starship is installed
  ansible.builtin.stat:
    path: /usr/local/bin/starship
  register: starship_binary

- name: Starship | {{ ansible_distribution }} | Install starship
  ansible.builtin.shell: |
    curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: /usr/local/bin/starship
  when: not starship_binary.stat.exists

- name: "Starship | {{ ansible_distribution }} | Ensure starship config directory structure exists"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  loop:
    - ~/.config

- name: "Starship | {{ ansible_distribution }} | Copy btop config"
  ansible.builtin.copy:
    src: starship.toml
    dest: ~/.config/starship.toml
    mode: "0644"