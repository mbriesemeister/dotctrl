
---
# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install GnuPG"
      become: true
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

  when: not (only_config | default(false))



# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Dotfiles"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Create GnuPG directory"
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.gnupg"
        state: directory
        mode: "0700"

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Import public GPG key"
      ansible.builtin.command:
        argv:
          - gpg
          - --import
          - "{{ setup_vault_path }}/gpg/public.asc"
      register: gpg_public_import
      changed_when: "'imported' in gpg_public_import.stderr"

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Import GPG subkeys"
      ansible.builtin.command:
        argv:
          - gpg
          - --import
          - "{{ setup_vault_path }}/gpg/private-subkeys.asc"
      register: gpg_subkey_import
      changed_when: "'imported' in gpg_subkey_import.stderr"
      no_log: true

  when: not (only_install | default(false))