---
# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_distribution }} | Install Password Store"
      become: true
      ansible.builtin.apt:
        name: pass
        state: present
        update_cache: yes

  when: not (only_config | default(false))



# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Password-Store Files"
  block:

    - name: "{{ role_name }} | {{ ansible_distribution }} | Read Password Store archive version"
      ansible.builtin.command:
        argv:
          - tar
          - -xOzf
          - "{{ setup_vault_path }}/password-store/password-store.tar.gz"
          - .password-store/VERSION
      register: password_store_archive_version
      changed_when: false


    - name: "{{ role_name }} | {{ ansible_distribution }} | Check installed Password Store version"
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.password-store/VERSION"
      register: password_store_installed_version
      failed_when: false
      changed_when: false


    - name: "{{ role_name }} | {{ ansible_distribution }} | Set installed Password Store version"
      ansible.builtin.set_fact:
        password_store_current_version: >-
          {{
            (password_store_installed_version.content | default('') | b64decode | trim)
            or '0.0.0'
          }}


    - name: "{{ role_name }} | {{ ansible_distribution }} | Deploy newer Password Store version"
      ansible.builtin.unarchive:
        src: "{{ setup_vault_path }}/password-store/password-store.tar.gz"
        dest: "{{ ansible_env.HOME }}"
        remote_src: true
      when: >-
        password_store_archive_version.stdout | trim
        is ansible.builtin.version(password_store_current_version, '>', version_type='semver')
 
  when: not (only_install | default(false))