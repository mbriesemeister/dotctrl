---

- name: "{{ role_name }} | {{ ansible_distribution }} | Check if setup vault is mounted"
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ setup_vault_path }}"
  register: setup_vault_mount
  changed_when: false
  failed_when: false

- name: "{{ role_name }} | {{ ansible_distribution }} | Import SSH tasks"
  ansible.builtin.import_tasks: ssh.yml
  when: setup_vault_mount.rc == 0

- name: "{{ role_name }} | {{ ansible_distribution }} | Import GPG tasks"
  ansible.builtin.import_tasks: gpg.yml
  when: setup_vault_mount.rc == 0

- name: "{{ role_name }} | {{ ansible_distribution }} | Import Password Store tasks"
  ansible.builtin.import_tasks: password-store.yml
  when: setup_vault_mount.rc == 0