---

# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_distribution }} | Install Sway dependencies"
      ansible.builtin.apt:
        name:
          - sway
          - swaybg
          - swayidle
          - xwayland
          - wl-clipboard
          - grim
          - slurp
          - libnotify-bin
        state: present
        #update_cache: yes
      become: true


    - name: "{{ role_name }} | {{ ansible_distribution }} | Ensure directory structure exists"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - ~/.config
        - ~/.config/sway

  when: not (only_config | default(false))


# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Dotfiles"
  block:

    - name: "{{ role_name }} | {{ ansible_distribution }} | Copy config"
      ansible.builtin.copy:
        src: config
        dest: ~/.config/sway/config
        mode: "0644"

  when: not (only_install | default(false))
  