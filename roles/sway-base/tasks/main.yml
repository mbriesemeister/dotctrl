---

- name: "sway-base | Block"
  block:
    - name: "sway-base | Checking for Distribution Config: {{ ansible_facts['distribution'] }}"
      ansible.builtin.stat:
        path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
      register: sway_base_distribution_config
      
    - name: "sway-base | Run Tasks: {{ ansible_facts['distribution'] }}"
      ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
      when: sway_base_distribution_config.stat.exists