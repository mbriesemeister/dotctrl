---

# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install"
      ansible.builtin.apt:
        name: swaylock
        state: present
      become: true

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Ensure directory structure exists"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - ~/.config
        - ~/.config/swaylock

  when: not (only_config | default(false))


# ---------------------------------------------------------
# CONFIG / DOTFILES
# ---------------------------------------------------------
- name: "{{ role_name }} | Deployment of Dotfiles"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Copy config"
      ansible.builtin.copy:
        src: config
        dest: ~/.config/swaylock/config
        mode: "0644"

  when: not (only_install | default(false))