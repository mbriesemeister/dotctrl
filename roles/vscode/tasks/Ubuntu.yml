---

# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | Installation and Setup"
  become: true
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install prerequisites"
      ansible.builtin.apt:
        name:
          - wget
          - gpg
        state: present
        update_cache: true

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Download Microsoft GPG key"
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /tmp/microsoft.asc
        mode: '0644'

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Dearmor Microsoft GPG key"
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg /tmp/microsoft.asc
        creates: /usr/share/keyrings/microsoft.gpg

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Add VS Code repository"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/vscode.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: amd64,arm64,armhf
          Signed-By: /usr/share/keyrings/microsoft.gpg

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install Visual Studio Code"
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: true

  when: not (only_config | default(false))