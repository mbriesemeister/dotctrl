---

# ---------------------------------------------------------
# INSTALLATION & STRUCTURE
# ---------------------------------------------------------
- name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Installation and Setup"
  block:

    - name: "{{ role_name }} | {{ ansible_facts['distribution'] }} | Install"
      ansible.builtin.apt:
        name: "lxappearance"
        state: present
      become: true

  when: not (only_config | default(false))